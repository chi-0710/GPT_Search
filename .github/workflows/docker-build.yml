name: ResearchRunner Java and frontend checks
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java-only database, regression and restore verification
        shell: pwsh
        run: ./scripts/test_java_migration.ps1 -JavaOnly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-results
          path: backend-java/target/surefire-reports/
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/nextjs/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
