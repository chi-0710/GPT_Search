services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gpt_researcher}
      POSTGRES_USER: ${POSTGRES_USER:-gpt_researcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gpt_researcher}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  migration:
    image: gptresearcher/gpt-researcher
    build: ./
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gpt_researcher}:${POSTGRES_PASSWORD:-gpt_researcher}@postgres:5432/${POSTGRES_DB:-gpt_researcher}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gpt-researcher:
    pull_policy: build
    image: gptresearcher/gpt-researcher
    build: ./
    environment: 
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gpt_researcher}:${POSTGRES_PASSWORD:-gpt_researcher}@postgres:5432/${POSTGRES_DB:-gpt_researcher}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      MAX_BLOB_SIZE_MB: ${MAX_BLOB_SIZE_MB:-50}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      DOCUMENT_CHUNK_SIZE: ${DOCUMENT_CHUNK_SIZE:-1000}
      DOCUMENT_CHUNK_OVERLAP: ${DOCUMENT_CHUNK_OVERLAP:-100}
      DOCUMENT_RETRIEVAL_LIMIT: ${DOCUMENT_RETRIEVAL_LIMIT:-8}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:${FRONTEND_PORT:-3002},http://127.0.0.1:${FRONTEND_PORT:-3002}}
      DOCUMENT_CONTEXT_CHAR_BUDGET: ${DOCUMENT_CONTEXT_CHAR_BUDGET:-12000}
      WEB_CONTEXT_CHAR_BUDGET: ${WEB_CONTEXT_CHAR_BUDGET:-12000}
      DOCUMENT_SIMILARITY_THRESHOLD: ${DOCUMENT_SIMILARITY_THRESHOLD:-0.35}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      FAST_LLM: ${FAST_LLM:-openai:gpt-5.4-mini}
      SMART_LLM: ${SMART_LLM:-openai:gpt-5.4}
      STRATEGIC_LLM: ${STRATEGIC_LLM:-openai:gpt-5.4}
      EMBEDDING: ${EMBEDDING:-openai:text-embedding-3-small}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY}
      LOGGING_LEVEL: INFO
      # Image generation (optional - set to enable inline images in reports)
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      IMAGE_GENERATION_ENABLED: ${IMAGE_GENERATION_ENABLED:-false}
      IMAGE_GENERATION_MODEL: ${IMAGE_GENERATION_MODEL:-gemini-2.0-flash-preview-image-generation}
      IMAGE_GENERATION_MAX_IMAGES: ${IMAGE_GENERATION_MAX_IMAGES:-3}
    depends_on:
      migration:
        condition: service_completed_successfully
    user: root
    restart: always
    ports:
      - 8000:8000
      
  gptr-nextjs:
    pull_policy: build
    image: gptresearcher/gptr-nextjs
    stdin_open: true
    environment:
      CHOKIDAR_USEPOLLING: "true"
      LOGGING_LEVEL: INFO
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
      NEXT_PUBLIC_GPTR_API_URL: ${NEXT_PUBLIC_GPTR_API_URL}
      INTERNAL_API_URL: http://gpt-researcher:8000
    build:
      dockerfile: Dockerfile.dev
      context: frontend/nextjs
    volumes:
      - /app/node_modules
      - ./frontend/nextjs:/app
      - ./frontend/nextjs/.next:/app/.next
    restart: always
    ports:
      - "${FRONTEND_PORT:-3002}:3000"

  gpt-researcher-tests:
    image: gptresearcher/gpt-researcher-tests
    build: ./
    environment: 
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY}
      LOGGING_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://gpt_researcher_test:gpt_researcher_test@postgres-test:5432/gpt_researcher_test
      RUN_POSTGRES_INTEGRATION: "1"
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
    depends_on:
      migration-test:
        condition: service_completed_successfully
    profiles: ["test"]
    command: >
      /bin/sh -c "
      pip install pytest pytest-asyncio faiss-cpu &&
      python -m pytest tests/ tests/report-types.py tests/vector-store.py
      "

  postgres-test:
    image: pgvector/pgvector:pg16
    profiles: ["test"]
    environment:
      POSTGRES_DB: gpt_researcher_test
      POSTGRES_USER: gpt_researcher_test
      POSTGRES_PASSWORD: gpt_researcher_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpt_researcher_test -d gpt_researcher_test"]
      interval: 3s
      timeout: 5s
      retries: 20

  migration-test:
    image: gptresearcher/gpt-researcher
    build: ./
    profiles: ["test"]
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://gpt_researcher_test:gpt_researcher_test@postgres-test:5432/gpt_researcher_test
    depends_on:
      postgres-test:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
